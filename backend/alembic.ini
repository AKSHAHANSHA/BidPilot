[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

; The database URL is intentionally absent. migrations/env.py reads it from the validated
; Settings object so there is exactly one source of connection configuration.

; No post-write hook: ruff ships a compiled binary rather than a console_scripts entry point,
; and hard-coding a venv path here would break across operating systems. Autogenerated
; revisions are reviewed and formatted with `make format` before being committed.
[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
