[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bidpilot-backend"
version = "0.1.0"
description = "BidPilot UAE — tender readiness analysis backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "alembic>=1.14",
    "redis>=5.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "email-validator>=2.2",
    "python-multipart>=0.0.18",
    "pymupdf>=1.25",
    "dramatiq[redis]>=1.17",
    "openai>=1.55",
    "boto3>=1.35",
]

# Dependencies for phases not yet implemented are deliberately absent:
#   dramatiq[redis]           -> Phase 5 (background jobs)
#   openai                    -> Phase 6 (requirement extraction)

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # bandit security checks
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF",
]
ignore = [
    "B008", # FastAPI dependency injection relies on calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "RUF001"] # asserts, dummy secrets, and typographic fixtures
"migrations/env.py" = ["E402"]
# Typographic characters (curly quotes, dashes) are the normalizer's subject matter.
"app/documents/normalize.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# boto3/botocore ship no type stubs; the S3 adapter treats the client as Any deliberately.
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires PostgreSQL and Redis (run via `make test-integration`)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
