# Render blueprint — single FREE Web Service for a student portfolio deployment.
#
# The free plan gives one service, so the Dramatiq worker runs INSIDE this web service
# (see backend/scripts/start.sh) rather than as a separate paid Background Worker. There is no
# paid service in this file.
#
# PostgreSQL (Supabase), Redis (Upstash), and object storage (Supabase Storage via its
# S3-compatible API) are all external free tiers, supplied as secrets (sync:false) — nothing here
# provisions a paid managed datastore.
#
# Apply with Render "Blueprints" -> New, then set the sync:false secrets in the dashboard.

services:
  - type: web
    name: bidpilot
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -e .
    # start.sh runs migrations, launches the worker in the background, then serves the API with
    # --proxy-headers so X-Forwarded-Proto from Render's proxy is honoured (correct https scheme
    # for Secure cookies and URLs).
    startCommand: bash scripts/start.sh
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: REFRESH_COOKIE_SAMESITE
        value: none
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: STORAGE_BACKEND
        value: s3
      - key: OPENAI_MODEL
        value: gpt-5-mini
      # --- Secrets: set these in the Render dashboard (never committed) ---
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
