name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  static-and-unit:
    name: Format, lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Format check
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check --output-format=github .

      - name: Type check
        run: python -m mypy app

      - name: Unit and API tests
        run: python -m pytest -m "not integration" --cov=app --cov-report=term-missing

      - name: Export OpenAPI
        env:
          JWT_SECRET: ci-only-secret-value-0123456789abcdef
        run: python scripts/export_openapi.py

      - name: Fail if the committed contract is stale
        run: git diff --exit-code -- artifacts/openapi.json

  integration:
    name: Migrations and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bidpilot
          POSTGRES_PASSWORD: bidpilot
          POSTGRES_DB: bidpilot
        # Host port matches docker-compose.yml and the DATABASE_URL in tests/conftest.py.
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U bidpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Service containers do not run docker-entrypoint-initdb.d scripts, so the test
      # database is created explicitly here.
      - name: Create the test database
        env:
          PGPASSWORD: bidpilot
        run: psql -h localhost -p 55432 -U bidpilot -d bidpilot -c "CREATE DATABASE bidpilot_test OWNER bidpilot;"

      - name: Integration tests
        run: python -m pytest -m integration
